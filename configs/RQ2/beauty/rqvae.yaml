data_dir: "./data/beauty"
train_interactions_file: "dvae_train_interactions.parquet"
holdout_interactions_file: "dvae_holdout_interactions.parquet"
device: "cuda"
seed: 42
mode: "train_holdout"
out_dir: "./results/RQ2/beauty/rqvae"
num_epochs: 5
early_stopping_patience: 20
early_stopping_min_delta: 0.0001
vocab_size: 256
embed_dim: 128
hidden_dims: [128]
latent_dim: 64
maxlen: 5
commitment_beta: 0.25
quantization_loss_weight: 1.0
reconstruction_loss_weight: 1.0
distance_batch_size: 512
init_encode_batch_size: 512
compile: auto
batch_num_tokens: 8192
shuffle: true
drop_last: true
lr: 1e-3
weight_decay: 1e-5
train_sample_frac_for_eval: 0.1111111111
log_every_steps: 20
eval_every_steps: 500
eval_detail: false
enable_progress_bar: false
progress_bar_every: 20
eval_batch_size: 512
per_step: true
expected_holdout_frac: 0.1
