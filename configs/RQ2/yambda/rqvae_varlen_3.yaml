data_dir: "./data/yambda"
train_interactions_file: "dvae_train_interactions.parquet"
holdout_interactions_file: "dvae_holdout_interactions.parquet"
device: "cuda"
seed: 42
mode: "train_holdout"
out_dir: "./results/RQ2/yambda/rqvae_varlen_3"
num_epochs: 5
vocab_size: 256
embed_dim: 128
hidden_dims: [128]
latent_dim: 64
maxlen: 5
varlen: true
commitment_beta: 0.25
quantization_loss_weight: 1.0
reconstruction_loss_weight: 1.0
distance_batch_size: 512
init_encode_batch_size: 512
stop_num_heads: 1
stop_dropout: 0.1
length_cost: 5.0
length_beta_start: 0.0
length_beta_end: 0.002
length_beta_warmup_fraction: 0.2
length_inference: "argmax"
compile: auto
batch_num_tokens: 8192
shuffle: true
drop_last: true
lr: 1e-3
weight_decay: 1e-5
train_sample_frac_for_eval: 0.1111111111
log_every_steps: 20
eval_every_steps: 500
eval_detail: false
enable_progress_bar: false
progress_bar_every: 20
eval_batch_size: 512
per_step: true
expected_holdout_frac: 0.1
