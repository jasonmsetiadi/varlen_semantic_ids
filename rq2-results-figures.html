      const charts = document.getElementById('charts');
      function lengthChart(metric, cutoff) {
        const dataset = document.getElementById('dataset-select').value;
        const values = data[dataset], W = 340, H = 270, m = { t: 55, r: 14, b: 45, l: 48 };
        const pw = W - m.l - m.r, ph = H - m.t - m.b;
        const colors = { dvae: '#3367d6', rkmeans: '#f4b400', rqvae: '#9c27b0', varlen_dvae: '#0f9d58', varlen_rqvae: '#e91e63' };
        const series = ['dvae', 'rkmeans', 'rqvae', 'varlen_dvae', 'varlen_rqvae'].filter(tokenizer => values[tokenizer]).map(tokenizer => ({
          tokenizer,
          points: values[tokenizer].lengths.map((length, i) => ({
            length,
            maxlen: values[tokenizer].maxlens[i],
            value: values[tokenizer][`${metric.toLowerCase()}${cutoff}`][i]
          }))
        }));
        const allPoints = series.flatMap(item => item.points);
        if (!allPoints.length) return '<p>No per-length dVAE or RKMeans seqrec.json files are available for this dataset.</p>';
        const max = Math.max(...allPoints.map(point => point.value)) * 1.12 || 1;
        const configuredMax = series.flatMap(item => item.points.map(point => point.maxlen || point.length));
        const maxLength = Math.max(1, ...configuredMax.map(length => Math.ceil(length)));
        const x = length => m.l + pw * (length - 1) / (maxLength - 1 || 1);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="dVAE and RKMeans ${metric}@${cutoff} by semantic ID length">`;
        for (let i=0; i<=4; i++) {
          const y = m.t + ph - ph*i/4, v = max*i/4;
          s += `<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-7}" y="${y+4}" text-anchor="end">${metric === 'Coverage' ? v.toFixed(0) : v.toFixed(3)}</text>`;
        }
        for (let len = 1; len <= maxLength; len++) {
          const tickX = x(len);
          s += `<line class="gridline" x1="${tickX}" x2="${tickX}" y1="${m.t+ph}" y2="${m.t+ph+4}"/>`;
          s += `<text x="${tickX}" y="${H-24}" text-anchor="middle">${len}</text>`;
        }
        s += `<text x="${W/2}" y="${H-5}" text-anchor="middle">Semantic ID length</text>`;
        s += `<text transform="translate(13 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${metric}${metric === 'Coverage' ? ' (items)' : ''}</text>`;
        series.forEach(({tokenizer, points}) => {
          const color = colors[tokenizer];
          const coords = points.map(point => `${x(point.length)},${m.t+ph-ph*point.value/max}`).join(' ');
          if (!tokenizer.startsWith('varlen_') && points.length > 1) s += `<polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
          points.forEach(point => {
            const fixedLabels = { dvae: 'dVAE', rkmeans: 'RKMeans', rqvae: 'RQ-VAE' };
            const label = tokenizer === 'varlen_dvae' ? `Varlen dVAE maxlen ${point.maxlen}` : tokenizer === 'varlen_rqvae' ? `Varlen RQ-VAE maxlen ${point.maxlen}` : fixedLabels[tokenizer];
            const px = x(point.length), py = m.t+ph-ph*point.value/max;
            if (tokenizer.startsWith('varlen_') && point.maxlen === 5) {
              s += `<path d="M ${px} ${py-5} L ${px+5} ${py} L ${px} ${py+5} L ${px-5} ${py} Z" fill="${color}"><title>${label}, ${metric}@${cutoff}, mean length ${point.length.toFixed(2)}: ${point.value}</title></path>`;
            } else if (tokenizer.startsWith('varlen_') && point.maxlen === 9) {
              s += `<path d="M ${px} ${py-5} L ${px+5} ${py+4} L ${px-5} ${py+4} Z" fill="${color}"><title>${label}, ${metric}@${cutoff}, mean length ${point.length.toFixed(2)}: ${point.value}</title></path>`;
            } else {
              s += `<circle cx="${px}" cy="${py}" r="4" fill="${color}"><title>${label}, ${metric}@${cutoff}, mean length ${point.length.toFixed(2)}: ${point.value}</title></circle>`;
            }
          });
        });
        return s + '</svg>';
      }
      function lengthDistributionChart(dataset) {
        const runs = ['varlen_dvae', 'varlen_rqvae'].flatMap(tokenizer =>
          (data[dataset][tokenizer]?.length_distributions || []).map(run => ({...run, tokenizer}))
        );
        if (!runs.length) return '<p>No variable-length distributions are available for this dataset.</p>';
        const W = 800, H = 320, m = { t: 34, r: 20, b: 52, l: 62 };
        const pw = W - m.l - m.r, ph = H - m.t - m.b;
        const maxLength = Math.max(...runs.map(run => run.maxlen));
        const groupWidth = pw / maxLength, barWidth = Math.min(24, groupWidth * 0.7 / runs.length);
        const colors = { varlen_dvae: '#0f9d58', varlen_rqvae: '#e91e63' };
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Variable-length semantic ID length distribution for ${dataset}">`;
        for (let tick = 0; tick <= 4; tick++) {
          const value = tick * 25, y = m.t + ph - ph * value / 100;
          s += `<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-8}" y="${y+4}" text-anchor="end">${value}%</text>`;
        }
        for (let length = 1; length <= maxLength; length++) {
          const center = m.l + groupWidth * (length - 0.5);
          s += `<text x="${center}" y="${H-25}" text-anchor="middle">${length}</text>`;
          runs.forEach((run, runIndex) => {
            const total = run.counts.reduce((sum, count) => sum + count, 0) || 1;
            const count = run.counts[length - 1] || 0;
            const percent = count / total * 100;
            const height = ph * percent / 100;
            const x = center + (runIndex - (runs.length - 1) / 2) * (barWidth + 2) - barWidth / 2;
            const y = m.t + ph - height;
            s += `<rect x="${x}" y="${y}" width="${barWidth}" height="${height}" fill="${colors[run.tokenizer]}"><title>${run.tokenizer === 'varlen_dvae' ? 'Varlen dVAE' : 'Varlen RQ-VAE'} maxlen ${run.maxlen}, allocated length ${length}: ${count} items (${percent.toFixed(1)}%)</title></rect>`;
          });
        }
        s += `<text x="${W/2}" y="${H-5}" text-anchor="middle">Allocated semantic ID length</text>`;
        s += `<text transform="translate(16 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">Items (%)</text>`;
        return s + '</svg>';
      }
      function render() {
        const dataset = document.getElementById('dataset-select').value;
        const lengths = [...data[dataset].dvae.lengths, ...data[dataset].rkmeans.lengths, ...(data[dataset].rqvae?.lengths || []), ...data[dataset].varlen_dvae.lengths, ...(data[dataset].varlen_rqvae?.lengths || [])];
        const oneLength = new Set(lengths).size === 1;
        const noRuns = lengths.length === 0;
        document.getElementById('plot-note').textContent = noRuns
          ? 'No per-length tokenizer seqrec results were found under results/RQ2/' + dataset + '/<tokenizer>/maxlen_*/seqrec.json.'
          : oneLength
          ? 'Only one semantic ID length is available across tokenizers. Variable-length markers are positioned by learned mean length.'
          : 'Variable-length markers are positioned by learned mean length; fixed-length tokenizer runs are connected.';
        const colors = { dvae: '#3367d6', rkmeans: '#f4b400', rqvae: '#9c27b0', varlen_dvae: '#0f9d58', varlen_rqvae: '#e91e63' };
        const varlenLegend = ['varlen_dvae', 'varlen_rqvae'].flatMap(tokenizer =>
          (data[dataset][tokenizer]?.maxlens || []).map(maxlen => {
            const shape = maxlen === 5 ? 'diamond' : maxlen === 9 ? 'triangle' : '';
            const label = tokenizer === 'varlen_dvae' ? 'Varlen dVAE' : 'Varlen RQ-VAE';
            return `<span><i class="${shape}" style="background:${colors[tokenizer]}"></i>${label} maxlen ${maxlen}</span>`;
          })
        ).join('');
        const rqvaeLegend = data[dataset].rqvae ? `<span><i style="background:${colors.rqvae}"></i>RQ-VAE</span>` : '';
        const legend = `<div class="chart-legend"><span><i style="background:${colors.dvae}"></i>dVAE</span><span><i style="background:${colors.rkmeans}"></i>RKMeans</span>${rqvaeLegend}${varlenLegend}</div>`;
        const metricCharts = [10, 100].map(cutoff => ['Recall', 'NDCG', 'Coverage'].map(metric => `<div class="panel"><h3>${metric}@${cutoff}</h3>${lengthChart(metric, cutoff)}${legend}</div>`).join('')).join('');
        const distributions = ['varlen_dvae', 'varlen_rqvae'].flatMap(tokenizer =>
          (data[dataset][tokenizer]?.length_distributions || []).map(run => ({...run, tokenizer}))
        );
        const distributionLegend = distributions.map(run => `<span><i style="background:${colors[run.tokenizer]}"></i>${run.tokenizer === 'varlen_dvae' ? 'Varlen dVAE' : 'Varlen RQ-VAE'} maxlen ${run.maxlen}</span>`).join('');
        charts.innerHTML = metricCharts + `<div class="panel distribution-panel"><h3>Variable-length allocated length distribution</h3>${lengthDistributionChart(dataset)}<div class="chart-legend">${distributionLegend}</div><p>Bars show the share of train-holdout items assigned each length, with missing lengths shown as zero.</p></div>`;
      }
      document.getElementById('dataset-select').addEventListener('change', render);
      render();
    })();
  </script>
</div>
